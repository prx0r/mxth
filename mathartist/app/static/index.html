<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MathArtist Lab</title><link rel="stylesheet" href="./style.css"></head><body>
<header id="top"><div class="brand">MATHARTIST <i>LAB</i></div><nav id="tabs"></nav><div id="density"><button data-n="36">36</button><button data-n="72" class="on">72</button><button data-n="108">108</button></div></header>
<div id="sub"><select id="source"></select><select id="studyExp" title="Study protocol"><option value="attention-rasa-v2">ATTENTION/RASA LAB</option><option value="commonization-v1">COMMONIZATION LAB</option></select><select id="youtubeMetric" title="YouTube wild objective"><option value="youtube-5s">YT · 5 SECOND</option><option value="youtube-10s">YT · 10|5 HOLD</option><option value="youtube-20s" selected>YT · 20|10 HOLD</option><option value="youtube-replay">YT · REPLAY</option></select><span id="provenance"></span><span class="spacer"></span><span id="generation"></span><button id="evolve">EVOLVE</button><button id="branch" style="display:none">BRANCH</button><button id="wander">WANDER</button><a href="/api/analysis" target="_blank">ANALYSIS</a><a href="/api/experiments" target="_blank">EXPERIMENTS</a><a href="/api/export" target="_blank">DATA</a></div>
<main id="grid"></main>
<div id="empty" hidden>No specimens yet.</div>
<div id="detail" class="hidden"><section class="stage"><canvas id="hero" width="900" height="900"></canvas><div class="hero-actions"><button id="fav">☆</button><button id="replay">↻</button><button id="close">×</button></div></section><aside><div class="eyebrow" id="dsource"></div><h1 id="dtitle"></h1><p id="dprov"></p><h3>CONTROL SURFACE</h3><pre id="dgenome"></pre><h3>STRUCTURAL READOUT</h3><pre id="dmetrics"></pre><h3>AESTHETIC RESPONSE <span class="optional">OPTIONAL</span></h3><button id="revealSurvey">AFTER VIEWING · RESPOND</button><div id="survey" class="hidden"><label>VALENCE <input id="valence" type="range" min="-1" max="1" step="0.1" value="0"></label><label>AROUSAL <input id="arousal" type="range" min="-1" max="1" step="0.1" value="0"></label><label>ABSORPTION <input id="absorption" type="range" min="-1" max="1" step="0.1" value="0"></label><div id="rasa"></div><textarea id="responseText" maxlength="500" placeholder="optional words / image association"></textarea><button id="submitResponse">RECORD RESPONSE</button></div><h3>LINEAGE</h3><div id="lineage"></div></aside></div>
<div id="toast"></div>
<script type="module" src="./js/app.js"></script></body></html>
